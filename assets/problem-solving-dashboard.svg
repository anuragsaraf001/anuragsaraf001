<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Anurag Saraf's Problem Solving Dashboard</title>
  <desc id="desc">A visual snapshot showing 412 verified platform solves: 203 on LeetCode, 99 on Codeforces, 94 on GeeksforGeeks, and 16 on CodeChef. LeetCode includes 103 Easy, 89 Medium, and 11 Hard solved problems.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#161329"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#18211d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="30" fill="url(#background)"/>
  <path d="M0 0H680C590 95 350 120 160 0Z" fill="#f97316" opacity="0.10"/>
  <circle cx="1110" cy="80" r="170" fill="#facc15" opacity="0.06"/>
  <rect x="28" y="28" width="1144" height="624" rx="24" fill="none" stroke="url(#accent)" stroke-opacity="0.52" stroke-width="2"/>

  <circle cx="87" cy="84" r="29" fill="#f97316" opacity="0.9"/>
