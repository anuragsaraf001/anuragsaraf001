    <text x="598" y="538" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">16</text>
    <text x="652" y="538" fill="#aab7cf" font-family="Arial, Helvetica, sans-serif" font-size="13">solved</text>

    <rect x="821" y="466" width="293" height="104" rx="14" fill="#182238"/>
    <text x="843" y="494" fill="#d7e1f0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Code360 &amp; Codolio</text>
    <text x="843" y="529" fill="#facc15" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Profile linked</text>
