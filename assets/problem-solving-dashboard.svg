    <rect x="836" y="254" width="271" height="11" rx="5" fill="#273247"/><rect x="836" y="254" width="271" height="11" rx="5" fill="url(#bar)"/>
    <text x="836" y="291" fill="#d7e1f0" font-family="Arial, Helvetica, sans-serif" font-size="13">Codeforces</text><text x="1107" y="291" text-anchor="end" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">99</text>
    <rect x="836" y="300" width="271" height="11" rx="5" fill="#273247"/><rect x="836" y="300" width="132" height="11" rx="5" fill="#f97316"/>
