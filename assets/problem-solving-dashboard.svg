  <text x="132" y="79" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Anurag's Problem Solving Dashboard</text>
  <text x="132" y="108" fill="#aab7cf" font-family="Arial, Helvetica, sans-serif" font-size="15">A verified public-profile snapshot · 9 September 2026</text>
  <rect x="132" y="123" width="168" height="4" rx="2" fill="url(#accent)"/>

